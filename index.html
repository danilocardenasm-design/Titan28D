<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan 28 - Entrenamiento Elite 2025 (Actualizado)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #e11d48; --bg: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 1rem; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .progress-ring { transform: rotate(-90deg); transform-origin: 50% 50%; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div id="app" class="max-w-md mx-auto p-4">
        
        <!-- WELCOME SCREEN -->
        <div id="screen-welcome" class="hidden h-screen flex flex-col justify-center items-center text-center space-y-8">
            <h1 class="text-6xl font-black italic text-white leading-none">TITAN <span class="text-rose-600">28</span></h1>
            <p class="text-slate-400 font-bold uppercase tracking-widest">Elite Home Training • Bogotá</p>
            <div class="w-full space-y-4 px-6">
                <button onclick="setGender('woman')" class="w-full py-5 bg-rose-600 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition uppercase">Modo Guerrera</button>
                <button onclick="setGender('man')" class="w-full py-5 bg-white text-slate-900 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition uppercase">Modo Atleta</button>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="screen-dashboard" class="hidden space-y-6">
            <header class="flex justify-between items-center py-4">
                <div>
                    <h2 id="user-greeting" class="text-2xl font-black text-white italic uppercase">¡HOLA!</h2>
                    <p class="text-rose-500 text-xs font-bold uppercase tracking-tighter">Acceso Total • Selección Libre</p>
                </div>
                <div class="relative w-16 h-16">
                    <svg class="w-full h-full progress-ring">
                        <circle class="text-slate-800" stroke-width="4" stroke="currentColor" fill="transparent" r="28" cx="32" cy="32"/>
                        <circle id="progress-circle" class="text-rose-600" stroke-width="4" stroke-linecap="round" stroke="currentColor" fill="transparent" r="28" cx="32" cy="32" stroke-dasharray="175.93" stroke-dashoffset="175.93" style="transition: stroke-dashoffset 1s ease;"/>
                    </svg>
                    <span id="progress-text" class="absolute inset-0 flex items-center justify-center text-xs font-black">0%</span>
                </div>
            </header>

            <!-- MODE SELECTOR -->
            <div class="glass p-2 rounded-2xl flex gap-2">
                <button id="btn-mode-woman" onclick="setGender('woman')" class="flex-1 py-3 rounded-xl font-bold text-xs uppercase transition">Guerrera</button>
                <button id="btn-mode-man" onclick="setGender('man')" class="flex-1 py-3 rounded-xl font-bold text-xs uppercase transition">Atleta</button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-4 rounded-2xl border-b-2 border-rose-600">
                    <p class="text-[10px] uppercase font-bold text-slate-400">Días Completados</p>
                    <p id="stat-days" class="text-2xl font-black">0/28</p>
                </div>
                <div class="glass p-4 rounded-2xl border-b-2 border-rose-600">
                    <p class="text-[10px] uppercase font-bold text-slate-400">Total Tiempo</p>
                    <p id="stat-time" class="text-2xl font-black text-rose-500">0 min</p>
                </div>
            </div>

            <div class="px-1 text-[10px] text-slate-500 font-bold uppercase tracking-widest text-center">Toca cualquier día para empezar</div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>

            <button onclick="openWorkout()" class="w-full py-6 bg-gradient-to-r from-rose-600 to-rose-700 rounded-2xl font-black text-white shadow-xl active:scale-95 transition uppercase italic text-lg">
                Iniciar Día <span id="btn-day-label">1</span> ⚡
            </button>
            
            <button onclick="resetApp()" class="w-full text-slate-600 text-[10px] font-bold uppercase tracking-widest hover:text-rose-500">Reiniciar todo</button>
        </div>

        <!-- WORKOUT SCREEN -->
        <div id="screen-workout" class="hidden space-y-6">
            <div class="flex items-center justify-between pt-4">
                <div class="flex items-center gap-4">
                    <button onclick="showDashboard()" class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-white text-lg">←</button>
                    <h2 class="text-2xl font-black italic uppercase text-white leading-tight">DÍA <span id="workout-day-number">1</span></h2>
                </div>
                <span id="workout-mode-tag" class="text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest"></span>
            </div>

            <div class="glass p-5 rounded-2xl border-l-4 border-amber-500 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-amber-500 font-black text-xs uppercase tracking-widest italic">Plan Nutricional Sugerido</h3>
                </div>
                <div id="nutrition-content" class="space-y-3"></div>
            </div>

            <div id="exercise-list" class="space-y-3 pb-10"></div>

            <div class="space-y-3">
                <button onclick="completeDay()" class="w-full py-5 bg-emerald-600 text-white rounded-2xl font-black uppercase shadow-lg shadow-emerald-900/40 active:scale-95 transition">Marcar como Completado ✅</button>
                <button onclick="showDashboard()" class="w-full py-3 text-slate-500 font-bold uppercase text-xs">Volver al Inicio</button>
            </div>
        </div>

        <!-- TIMER MODAL -->
        <div id="modal-timer" class="fixed inset-0 z-50 bg-slate-950 hidden flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <button onclick="closeTimer()" class="flex items-center gap-2 text-rose-500 font-black uppercase text-xs">
                    <span class="text-xl">←</span> Volver a la rutina
                </button>
                <span class="text-slate-600 font-black italic tracking-tighter text-sm uppercase">Titan Timer</span>
            </div>
            
            <div class="flex-1 flex flex-col items-center space-y-8">
                <div class="w-full video-container shadow-2xl">
                    <iframe id="timer-iframe" src="" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                </div>

                <div class="text-center">
                    <h3 id="timer-name" class="text-3xl font-black uppercase italic text-white leading-tight">EJERCICIO</h3>
                    <p id="timer-reps" class="text-rose-500 font-black text-lg uppercase mt-2">-- REPS</p>
                </div>

                <div class="relative flex items-center justify-center">
                    <svg class="w-48 h-48 -rotate-90">
                        <circle class="text-slate-800" stroke-width="6" stroke="currentColor" fill="transparent" r="85" cx="96" cy="96"/>
                        <circle id="timer-bar" class="text-rose-600" stroke-width="8" stroke-linecap="round" stroke="currentColor" fill="transparent" r="85" cx="96" cy="96" stroke-dasharray="534" stroke-dashoffset="0" style="transition: stroke-dashoffset 1s linear;"/>
                    </svg>
                    <div id="timer-text" class="absolute text-5xl font-black text-white tabular-nums">00:00</div>
                </div>

                <div class="flex gap-4 w-full">
                    <button id="btn-timer-action" onclick="toggleTimer()" class="flex-1 py-5 bg-rose-600 text-white rounded-2xl font-black text-xl shadow-lg uppercase tracking-wider active:scale-95 transition">Comenzar</button>
                    <button onclick="resetTimer()" class="w-20 bg-slate-800 text-white rounded-2xl text-2xl flex items-center justify-center">🔄</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === Base database actualizado: he añadido campo `alt` con enlaces alternativos cuando fue necesario ===
        const DATABASE = {
            warmup: [
                { name: "Movilidad Articular", yt: "vecL7q7-WnA", reps: "5 min", alt: "https://www.youtube.com/watch?v=6meub2M2GZo" },
                { name: "Activación Cardio", yt: "gC_L9qAHVJ8", reps: "5 min", alt: "" },
                { name: "Estiramiento Dinámico", yt: "x9_t2q-1oTk", reps: "5 min", alt: "https://www.youtube.com/watch?v=3qyWpJ34dWw" }
            ],
            man: {
                label: "Modo Atleta",
                strength: [
                    { name: "Flexiones de Brazo", yt: "IODxDxX7oi4", reps: "20 reps", alt: "https://www.youtube.com/watch?v=WDIpL0pjun0" },
                    { name: "Sentadilla de Poder", yt: "aclHkVaku9U", reps: "25 reps", alt: "" },
                    { name: "Zancadas Dinámicas", yt: "L8f6pS8E_Hk", reps: "15 por lado", alt: "https://www.youtube.com/watch?v=Z2n58m2i4jg" },
                    { name: "Dips de Tríceps", yt: "6kALZikcIcM", reps: "15 reps", alt: "https://www.youtube.com/watch?v=WVeZDBhZwLA" },
                    { name: "Sentadilla Isométrica", yt: "rX9-V-J7_Jg", reps: "60 seg", alt: "https://www.youtube.com/watch?v=3yLTIDb6lTg" }
                ],
                hiit: [
                    { name: "Burpees Clásicos", yt: "auBLPXOqv_w", reps: "45 seg", alt: "https://www.youtube.com/watch?v=JZQA08SlJnM" },
                    { name: "Escaladores", yt: "nmwgirgXLyM", reps: "45 seg", alt: "https://www.youtube.com/watch?v=nmwgirgXLYM" },
                    { name: "Jumping Jacks", yt: "c4DAnQ6DtF8", reps: "60 seg", alt: "" },
                    { name: "Sprints Estáticos", yt: "8i3V1XN9_7M", reps: "45 seg", alt: "https://www.youtube.com/watch?v=e43SB_pHeuQ" }
                ],
                core: [
                    { name: "Plancha Abdominal", yt: "pSHjTRCQxIw", reps: "60 seg", alt: "" },
                    { name: "Crunches", yt: "Xyd_fa5zoEU", reps: "25 reps", alt: "" },
                    { name: "Giro Ruso", yt: "waI6s_D9ZOM", reps: "40 reps", alt: "https://www.youtube.com/watch?v=JyUqwkVpsi8" }
                ]
            },
            woman: {
                label: "Modo Guerrera",
                strength: [
                    { name: "Sentadilla Sumo", yt: "9v-pL9895mI", reps: "25 reps", alt: "https://www.youtube.com/watch?v=kjlfpqXnyL8" },
                    { name: "Puente de Glúteo", yt: "8RL5h7uJjKw", reps: "30 reps", alt: "https://www.youtube.com/watch?v=OUgsJ8-Vi0E" },
                    { name: "Patada de Glúteo", yt: "SJ1Xuz9D-dU", reps: "20 por lado", alt: "https://www.youtube.com/watch?v=-u2KtdPwmew" },
                    { name: "Zancada Lateral", yt: "QOVaHwm-Q6U", reps: "15 por lado", alt: "https://www.youtube.com/watch?v=XvVHtYqvkS8" },
                    { name: "Abducción Pierna", yt: "VlwBJEacn9I", reps: "20 por lado", alt: "https://www.youtube.com/watch?v=DAAjOdwZdks" }
                ],
                hiit: [
                    { name: "Skater Jumps", yt: "4RzXh7P7zHQ", reps: "45 seg", alt: "" },
                    { name: "Jumping Jacks", yt: "c4DAnQ6DtF8", reps: "60 seg", alt: "" },
                    { name: "Rodillas Arriba", yt: "8i3V1XN9_7M", reps: "45 seg", alt: "https://www.youtube.com/watch?v=e43SB_pHeuQ" },
                    { name: "Burpees Sin Salto", yt: "x1-bM7-XqSM", reps: "45 seg", alt: "https://www.youtube.com/watch?v=JZQA08SlJnM" }
                ],
                core: [
                    { name: "Bicicleta", yt: "Iwyvozckjak", reps: "30 reps", alt: "" },
                    { name: "Tijeras de Piernas", yt: "l4kQd9eWclE", reps: "45 seg", alt: "" },
                    { name: "Toque Talón", yt: "R_Zz2f7Q530", reps: "20 reps", alt: "https://www.youtube.com/watch?v=vc-8G9SZvuc" }
                ]
            },
            cooldown: [
                { name: "Estiramiento Final", yt: "x9_t2q-1oTk", reps: "7 min", alt: "https://www.youtube.com/watch?v=3qyWpJ34dWw" },
                { name: "Vuelta a la Calma", yt: "u7P_eL8vIms", reps: "7 min", alt: "https://www.youtube.com/watch?v=1AGiq77wZ9c" }
            ]
        };

        // === resto del script (sin cambios funcionales) ===
        const NUTRITION = {
            man: [
                { d: "Calentado de lentejas con 3 huevos y arepa de maíz peto.", a: "Pechuga de pollo (250g) + Arroz blanco + Tajadas de plátano + Aguacate.", c: "Lomo de res + Ensalada de tomate y cebolla + Té caliente." },
                { d: "Café con leche + Queso cuajada + 2 huevos con cebolla y tomate.", a: "Trucha + Yuca cocida + Ensalada de repollo y zanahoria.", c: "Atún + Galletas de soda + Porción de papaya." },
                { d: "Avena con leche y banano maduro.", a: "Carne molida + Frijoles rojos + Arroz + Aguacate.", c: "Huevos pericos + Tajada de queso costeño + Jugo." }
            ],
            woman: [
                { d: "Yogur griego + Frutas (fresa/papaya) + Semillas.", a: "Ensalada de atún con quinoa + Aguacate + Tomate.", c: "Pechuga desmechada + Champiñones + Ensalada verde." },
                { d: "Arepa de maíz con cuajada + Tinto sin azúcar.", a: "Sobrebarriga delgada + Papa salada + Ensalada verde.", c: "Tortilla de claras con espinaca + Melón." },
                { d: "Batido de banano, leche y avena + 5 almendras.", a: "Pollo sudado + Zanahoria y habichuela + Media de arroz.", c: "Sopa de verduras + Huevo cocido." }
            ]
        };

        let state = {
            gender: localStorage.getItem('titan_gender'),
            completed: JSON.parse(localStorage.getItem('titan_comp') || '[]'),
            totalTime: parseInt(localStorage.getItem('titan_time') || '0'),
            activeDay: 1
        };

        function init() {
            if (!state.gender) showScreen('welcome');
            else {
                state.activeDay = state.completed.length > 0 ? (Math.max(...state.completed) % 28) + 1 : 1;
                showDashboard();
            }
        }

        function showScreen(id) {
            document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(`screen-${id}`).classList.remove('hidden');
        }

        function setGender(g) {
            state.gender = g;
            localStorage.setItem('titan_gender', g);
            updateModeButtons();
            showDashboard();
        }

        function updateModeButtons() {
            const btnW = document.getElementById('btn-mode-woman');
            const btnM = document.getElementById('btn-mode-man');
            if (state.gender === 'woman') {
                btnW.className = "flex-1 py-3 rounded-xl font-bold text-xs uppercase bg-rose-600 text-white shadow-lg";
                btnM.className = "flex-1 py-3 rounded-xl font-bold text-xs uppercase text-slate-400 hover:text-white";
            } else {
                btnM.className = "flex-1 py-3 rounded-xl font-bold text-xs uppercase bg-white text-slate-900 shadow-lg";
                btnW.className = "flex-1 py-3 rounded-xl font-bold text-xs uppercase text-slate-400 hover:text-rose-500";
            }
        }

        function showDashboard() {
            showScreen('dashboard');
            updateModeButtons();
            const percent = (state.completed.length / 28) * 100;
            document.getElementById('progress-circle').style.strokeDashoffset = 175.93 - (percent / 100 * 175.93);
            document.getElementById('progress-text').innerText = `${Math.round(percent)}%`;
            document.getElementById('stat-days').innerText = `${state.completed.length}/28`;
            document.getElementById('stat-time').innerText = `${state.totalTime} min`;
            document.getElementById('btn-day-label').innerText = state.activeDay;
            document.getElementById('user-greeting').innerText = `¡HOLA, ${state.gender === 'man' ? 'ATLETA' : 'GUERRERA'}!`;
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            for(let i=1; i<=28; i++) {
                const isDone = state.completed.includes(i);
                const isCurr = state.activeDay === i;
                const d = document.createElement('div');
                
                d.className = `h-11 rounded-lg flex items-center justify-center font-black text-xs border transition cursor-pointer
                    ${isDone ? 'bg-emerald-600 border-emerald-400 text-white' : isCurr ? 'border-rose-500 bg-rose-500/20 text-rose-500' : 'glass border-slate-700 text-slate-400 hover:border-rose-400'}`;
                
                d.innerText = i;
                d.onclick = () => { 
                    state.activeDay = i; 
                    openWorkout(); 
                };
                grid.appendChild(d);
            }
        }

        function openWorkout() {
            showScreen('workout');
            document.getElementById('workout-day-number').innerText = state.activeDay;
            
            const modeTag = document.getElementById('workout-mode-tag');
            modeTag.innerText = DATABASE[state.gender].label;
            modeTag.className = `text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest ${state.gender === 'woman' ? 'bg-rose-600/20 text-rose-500' : 'bg-white/20 text-white'}`;

            const nutri = NUTRITION[state.gender][(state.activeDay - 1) % 3];
            document.getElementById('nutrition-content').innerHTML = `
                <div class="text-[11px] leading-relaxed">
                    <p class="text-amber-500 font-bold uppercase mb-1">Mañana:</p> <p class="text-slate-200 mb-2">${nutri.d}</p>
                    <p class="text-amber-500 font-bold uppercase mb-1">Almuerzo:</p> <p class="text-slate-200 mb-2">${nutri.a}</p>
                    <p class="text-amber-500 font-bold uppercase mb-1">Cena:</p> <p class="text-slate-200">${nutri.c}</p>
                </div>
            `;

            const p = DATABASE[state.gender];
            const routine = [
                {...DATABASE.warmup[state.activeDay % 3], time: 300, type: "Calentamiento"},
                {...p.strength[state.activeDay % p.strength.length], time: 600, type: "Fuerza 1"},
                {...p.hiit[state.activeDay % p.hiit.length], time: 600, type: "HIIT A"},
                {...p.core[state.activeDay % p.core.length], time: 600, type: "Core"},
                {...p.strength[(state.activeDay+1) % p.strength.length], time: 600, type: "Fuerza 2"},
                {...p.hiit[(state.activeDay+1) % p.hiit.length], time: 600, type: "HIIT B"},
                {...DATABASE.cooldown[state.activeDay % 2], time: 300, type: "Final"}
            ];

            const list = document.getElementById('exercise-list');
            list.innerHTML = '';
            routine.forEach(ex => {
                const card = document.createElement('div');
                card.className = "glass p-4 rounded-2xl flex items-center gap-4 border-l-2 border-rose-600 active:bg-slate-800 transition";
                card.innerHTML = `
                    <div class="w-12 h-12 bg-black rounded-lg overflow-hidden flex-shrink-0">
                        <img src="https://img.youtube.com/vi/${ex.yt}/mqdefault.jpg" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1">
                        <h4 class="text-[11px] font-black uppercase text-white leading-tight">${ex.name}</h4>
                        <p class="text-[9px] text-rose-500 font-bold uppercase tracking-widest">${ex.reps} • ${ex.type}</p>
                    </div>
                    <button onclick="startTimer('${ex.name}', '${ex.reps}', ${ex.time}, '${ex.yt}', '${ex.alt || ''}')" class="bg-rose-600 px-3 py-2 rounded-lg text-[10px] font-black uppercase shadow-lg active:scale-95 transition">Ver</button>
                `;
                list.appendChild(card);
            });
            window.scrollTo(0,0);
        }

        let tInt = null, tLeft = 0, tTotal = 0;

        function startTimer(name, reps, sec, yt, alt) {
            tLeft = sec; tTotal = sec;
            document.getElementById('timer-name').innerText = name;
            document.getElementById('timer-reps').innerText = reps;
            document.getElementById('timer-text').innerText = formatTime(sec);

            // prefer YouTube embed; if yt is empty or unavailable user can use alt link shown below
            const embedUrl = yt ? `https://www.youtube.com/embed/${yt}?autoplay=1&mute=1&modestbranding=1&rel=0&playsinline=1&enablejsapi=1` : '';
            document.getElementById('timer-iframe').src = embedUrl;
            document.getElementById('modal-timer').classList.remove('hidden');
            document.getElementById('timer-bar').style.strokeDashoffset = 0;
            resetTimerUI();

            // if there's an alt link (because the original YT was unavailable), show it under the timer name
            if(alt) {
                const timerName = document.getElementById('timer-name');
                const a = document.createElement('a');
                a.href = alt;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.className = 'block text-xs text-slate-400 mt-2';
                a.innerText = 'Video alternativo / recurso: abrir en nueva pestaña';
                // remove previous alt link if any
                const prev = document.getElementById('alt-link');
                if(prev) prev.remove();
                a.id = 'alt-link';
                timerName.parentNode.appendChild(a);
            }
        }

        function formatTime(s) {
            const m = Math.floor(s/60);
            const sc = s%60;
            return `${m.toString().padStart(2,'0')}:${sc.toString().padStart(2,'0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('btn-timer-action');
            if(tInt) {
                clearInterval(tInt); tInt = null;
                btn.innerText = "CONTINUAR";
                btn.classList.replace('bg-slate-700', 'bg-rose-600');
            } else {
                btn.innerText = "PAUSAR";
                btn.classList.replace('bg-rose-600', 'bg-slate-700');
                tInt = setInterval(() => {
                    tLeft--;
                    document.getElementById('timer-text').innerText = formatTime(tLeft);
                    document.getElementById('timer-bar').style.strokeDashoffset = 534 - (tLeft/tTotal * 534);
                    if(tLeft <= 0) { 
                        clearInterval(tInt); 
                        tInt = null; 
                        document.getElementById('timer-text').innerText = "¡LISTO!";
                        document.getElementById('btn-timer-action').innerText = "EJERCICIO COMPLETADO";
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(tInt); tInt = null;
            tLeft = tTotal;
            document.getElementById('timer-text').innerText = formatTime(tLeft);
            document.getElementById('timer-bar').style.strokeDashoffset = 0;
            resetTimerUI();
        }

        function resetTimerUI() { 
            const btn = document.getElementById('btn-timer-action');
            btn.innerText = "COMENZAR"; 
            btn.className = "flex-1 py-5 bg-rose-600 text-white rounded-2xl font-black text-xl shadow-lg uppercase tracking-wider active:scale-95 transition";
        }

        function closeTimer() {
            clearInterval(tInt); tInt = null;
            document.getElementById('timer-iframe').src = "";
            const prev = document.getElementById('alt-link'); if(prev) prev.remove();
            document.getElementById('modal-timer').classList.add('hidden');
        }

        function completeDay() {
            if(!state.completed.includes(state.activeDay)) {
                state.completed.push(state.activeDay);
                state.totalTime += 45; 
                localStorage.setItem('titan_comp', JSON.stringify(state.completed));
                localStorage.setItem('titan_time', state.totalTime);
            }
            showDashboard();
        }

        function resetApp() {
            if(confirm("¿Seguro que quieres borrar todo tu progreso de Titan 28?")) {
                localStorage.clear();
                location.reload();
            }
        }

        window.onload = init;
    </script>
