<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan 28 - Elite Fitness Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e11d48;
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
        }
        .progress-ring {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .exercise-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            background: #000;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 1.5rem;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .active-dot {
            width: 8px;
            height: 8px;
            background-color: #e11d48;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 10px #e11d48;
        }
    </style>
</head>
<body class="min-h-screen pb-24">

    <div id="app" class="max-w-md mx-auto p-4">
        <!-- Pantalla de Bienvenida -->
        <div id="screen-welcome" class="hidden h-screen flex flex-col justify-center items-center text-center space-y-8">
            <div class="space-y-2">
                <h1 class="text-5xl font-extrabold tracking-tighter italic text-white">TITAN <span class="text-rose-600">28</span></h1>
                <p class="text-slate-400 italic">28 Días. Diferentes Rutinas. Un Objetivo.</p>
            </div>
            <div class="w-full space-y-4 px-6">
                <button onclick="setGender('woman')" class="w-full py-4 bg-rose-600 hover:bg-rose-700 rounded-2xl font-bold text-xl transition transform active:scale-95 shadow-lg shadow-rose-900/40 uppercase">
                    RUTINA PARA MUJER
                </button>
                <button onclick="setGender('man')" class="w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-900 rounded-2xl font-bold text-xl transition transform active:scale-95 shadow-lg shadow-white/10 uppercase">
                    RUTINA PARA HOMBRE
                </button>
            </div>
        </div>

        <!-- Dashboard Principal -->
        <div id="screen-dashboard" class="hidden space-y-6">
            <header class="flex justify-between items-center py-4">
                <div>
                    <h2 id="user-greeting" class="text-2xl font-bold">¡Hola, Atleta!</h2>
                    <p class="text-slate-400 text-sm italic" id="weekly-focus">Cargando enfoque...</p>
                </div>
                <div class="relative w-16 h-16">
                    <svg class="w-full h-full progress-ring">
                        <circle class="text-slate-800" stroke-width="4" stroke="currentColor" fill="transparent" r="28" cx="32" cy="32"/>
                        <circle id="progress-circle" class="text-rose-600" stroke-width="4" stroke-linecap="round" stroke="currentColor" fill="transparent" r="28" cx="32" cy="32" stroke-dasharray="175.93" stroke-dashoffset="175.93"/>
                    </svg>
                    <span id="progress-text" class="absolute inset-0 flex items-center justify-center text-xs font-bold">0%</span>
                </div>
            </header>

            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-4 rounded-2xl text-center">
                    <p class="text-slate-400 text-[10px] uppercase font-bold tracking-widest mb-1">Esfuerzo Total</p>
                    <p id="stat-total-time" class="text-xl font-bold text-rose-500">0 min</p>
                </div>
                <div class="glass p-4 rounded-2xl text-center">
                    <p class="text-slate-400 text-[10px] uppercase font-bold tracking-widest mb-1">Días de Éxito</p>
                    <p id="stat-days-done" class="text-xl font-bold text-rose-500">0/28</p>
                </div>
            </div>

            <div>
                <h3 class="font-bold mb-4 flex items-center gap-2 text-white">📅 Calendario de Progresión</h3>
                <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
            </div>

            <button id="main-action-btn" onclick="openWorkout()" class="w-full py-5 bg-gradient-to-r from-rose-600 to-rose-700 rounded-2xl font-bold flex justify-center items-center gap-3 shadow-xl shadow-rose-900/30 transition transform active:scale-95">
                <span id="btn-text">INICIAR ENTRENAMIENTO</span>
                <span class="text-xl">⚡</span>
            </button>
        </div>

        <!-- Pantalla de Entrenamiento -->
        <div id="screen-workout" class="hidden space-y-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button onclick="showDashboard()" class="w-10 h-10 flex items-center justify-center bg-slate-800 rounded-full text-white">←</button>
                    <div>
                        <h2 class="text-xl font-bold italic text-white uppercase leading-tight">DÍA <span id="workout-day-number"></span></h2>
                        <p id="workout-type" class="text-[10px] text-rose-500 font-black uppercase tracking-widest"></p>
                    </div>
                </div>
            </div>

            <div id="exercise-list" class="space-y-4">
                <!-- Se llena dinámicamente -->
            </div>

            <button onclick="completeDay()" class="w-full py-4 bg-emerald-600 text-white rounded-2xl font-bold shadow-lg shadow-emerald-900/20 mt-4 transition active:scale-95 uppercase tracking-wider">
                Completar Entrenamiento del Día ✅
            </button>
        </div>

        <!-- Modal Multimedia / Cronómetro -->
        <div id="modal-timer" class="fixed inset-0 z-50 bg-slate-950 hidden flex flex-col p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <span class="text-rose-500 font-bold tracking-tighter italic">TITAN 28</span>
                <button onclick="closeTimer()" class="w-12 h-12 flex items-center justify-center bg-slate-800 rounded-full text-white text-2xl">&times;</button>
            </div>
            
            <div class="flex-1 flex flex-col items-center space-y-6">
                <div class="w-full video-container shadow-2xl border border-slate-700">
                    <iframe id="timer-video-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>

                <div class="text-center">
                    <h3 id="timer-exercise-name" class="text-3xl font-black uppercase italic tracking-tight mb-1 text-white leading-none">EJERCICIO</h3>
                    <p id="timer-reps" class="text-rose-500 font-bold tracking-widest text-sm uppercase mt-2">OBJETIVO: 4 x 15</p>
                </div>

                <div class="relative flex items-center justify-center">
                    <svg class="w-52 h-52 -rotate-90">
                        <circle class="text-slate-800" stroke-width="6" stroke="currentColor" fill="transparent" r="95" cx="104" cy="104"/>
                        <circle id="timer-circle" class="text-rose-600" stroke-width="8" stroke-linecap="round" stroke="currentColor" fill="transparent" r="95" cx="104" cy="104" stroke-dasharray="596.9" stroke-dashoffset="0" style="transition: stroke-dashoffset 1s linear;"/>
                    </svg>
                    <div id="timer-display" class="absolute text-5xl font-black tabular-nums text-white">00:00</div>
                </div>

                <div class="flex gap-4 w-full max-w-sm">
                    <button id="btn-timer-toggle" onclick="toggleTimer()" class="flex-1 py-5 bg-rose-600 text-white rounded-2xl font-bold text-xl shadow-lg shadow-rose-900/40">INICIAR</button>
                    <button onclick="resetTimer()" class="w-20 bg-slate-800 text-white rounded-2xl flex items-center justify-center text-xl">🔄</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-xl border-t border-slate-800 p-4 max-w-md mx-auto flex justify-around items-center z-40">
        <button onclick="showDashboard()" class="p-2 flex flex-col items-center text-rose-500">
            <span class="text-2xl">🏠</span>
            <span class="text-[9px] font-black mt-1">DASHBOARD</span>
        </button>
        <button onclick="alert('Estadísticas avanzadas próximamente')" class="p-2 flex flex-col items-center text-slate-500 opacity-50">
            <span class="text-2xl">📈</span>
            <span class="text-[9px] font-black mt-1">REPORTES</span>
        </button>
        <button onclick="resetApp()" class="p-2 flex flex-col items-center text-slate-500 opacity-50">
            <span class="text-2xl">⚙️</span>
            <span class="text-[9px] font-black mt-1">AJUSTES</span>
        </button>
    </nav>

    <script>
        // --- MOTOR DE RUTINAS DINÁMICAS ---
        const EXERCISE_POOL = {
            man: {
                strength: [
                    { name: "Flexiones Diamante", time: 45, reps: "20 reps", ytId: "J0DnG1_S92I" },
                    { name: "Sentadilla con Salto", time: 45, reps: "15 reps", ytId: "Azl5tkCzDcc" },
                    { name: "Zancadas de Poder", time: 60, reps: "20 reps", ytId: "L8f6pS8E_Hk" },
                    { name: "Dominadas", time: 60, reps: "Al fallo", ytId: "eGo4IYlbE5g" }
                ],
                hiit: [
                    { name: "Burpees Militares", time: 45, reps: "12 reps", ytId: "dZgVxmf6jkA" },
                    { name: "Escaladores", time: 30, reps: "Máximo ritmo", ytId: "zT-9L37ReNc" },
                    { name: "Jump Jacks", time: 60, reps: "Sin parar", ytId: "iSSAk4XCsRA" },
                    { name: "Boxeo Sombra", time: 60, reps: "Intenso", ytId: "SIn8-X5qUuY" }
                ],
                core: [
                    { name: "Plancha con Toque", time: 45, reps: "Controlado", ytId: "T19pWJ_2P64" },
                    { name: "V-Ups Abdominales", time: 45, reps: "15 reps", ytId: "7X_Svt21HVs" },
                    { name: "Russian Twist", time: 45, reps: "30 reps", ytId: "wkD8rjkodUI" }
                ]
            },
            woman: {
                strength: [
                    { name: "Sentadilla Goblet", time: 45, reps: "20 reps", ytId: "m0CStidmIsY" },
                    { name: "Zancadas Laterales", time: 45, reps: "12 c/lado", ytId: "QOVaHwm-Q6U" },
                    { name: "Puente de Glúteo 1 Pierna", time: 45, reps: "15 c/lado", ytId: "wPM8icPu6H8" },
                    { name: "Flexiones Inclinadas", time: 45, reps: "12 reps", ytId: "8I5YV62S9nU" }
                ],
                hiit: [
                    { name: "Burpees Suaves", time: 45, reps: "10 reps", ytId: "8I5YV62S9nU" },
                    { name: "Salto de Cuerda Imag.", time: 60, reps: "Ritmo alto", ytId: "SIs8-X5qUuY" },
                    { name: "Skating Jumps", time: 45, reps: "20 reps", ytId: "SIs8-X5qUuY" }
                ],
                core: [
                    { name: "Donkey Kicks", time: 45, reps: "20 reps", ytId: "SJ1Xuz9D-dU" },
                    { name: "Plancha Abdominal", time: 40, reps: "Mantener", ytId: "TvxNkmjdhMM" },
                    { name: "Bicycle Crunches", time: 45, reps: "30 reps", ytId: "wkD8rjkodUI" }
                ]
            }
        };

        let state = {
            gender: localStorage.getItem('titan_gender') || null,
            completedDays: JSON.parse(localStorage.getItem('titan_completed')) || [],
            totalTimeSpent: parseInt(localStorage.getItem('titan_time')) || 0,
            activeDay: 1
        };

        function init() {
            if (!state.gender) showScreen('welcome');
            else {
                state.activeDay = state.completedDays.length + 1;
                showDashboard();
            }
        }

        function setGender(g) {
            state.gender = g;
            localStorage.setItem('titan_gender', g);
            state.activeDay = 1;
            showDashboard();
        }

        function showScreen(screen) {
            document.querySelectorAll('#app > div').forEach(d => d.classList.add('hidden'));
            document.getElementById(`screen-${screen}`).classList.remove('hidden');
        }

        function showDashboard() {
            showScreen('dashboard');
            updateUI();
            renderCalendar();
        }

        function updateUI() {
            const currentDay = state.completedDays.length + 1;
            const week = Math.ceil(currentDay / 7);
            const focusMap = [
                "Adaptación Metabólica", 
                "Fuerza e Hipertrofia", 
                "Quema de Grasa Extrema", 
                "Titan Performance"
            ];
            
            document.getElementById('weekly-focus').innerHTML = `<span class="active-dot"></span>Semana ${week}: ${focusMap[week-1] || "Finalizado"}`;
            document.getElementById('btn-text').innerText = `DÍA ${currentDay > 28 ? 28 : currentDay}: INICIAR`;
            document.getElementById('stat-total-time').innerText = `${state.totalTimeSpent} min`;
            document.getElementById('stat-days-done').innerText = `${state.completedDays.length}/28`;
            
            const percent = Math.round((state.completedDays.length / 28) * 100);
            const circle = document.getElementById('progress-circle');
            circle.style.strokeDashoffset = 175.93 - (percent / 100 * 175.93);
            document.getElementById('progress-text').innerText = `${percent}%`;
            document.getElementById('user-greeting').innerText = `¡Hola, ${state.gender === 'man' ? 'Atleta' : 'Guerrera'}!`;
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 28; i++) {
                const isCompleted = state.completedDays.includes(i);
                const isCurrent = (state.completedDays.length + 1) === i;
                const day = document.createElement('div');
                day.className = `h-10 text-[10px] font-bold flex items-center justify-center rounded-lg border transition cursor-pointer 
                    ${isCompleted ? 'bg-emerald-600 border-emerald-400 text-white' : 
                      isCurrent ? 'border-rose-500 bg-rose-500/10 text-rose-500' : 'glass border-slate-800 text-slate-500'}`;
                day.innerText = i;
                day.onclick = () => { if(i <= state.completedDays.length + 1) { state.activeDay = i; openWorkout(); } };
                grid.appendChild(day);
            }
        }

        function openWorkout() {
            if (state.activeDay > 28) state.activeDay = 28;
            showScreen('workout');
            document.getElementById('workout-day-number').innerText = state.activeDay;
            
            const routineType = getRoutineTypeForDay(state.activeDay);
            document.getElementById('workout-type').innerText = `Enfoque: ${routineType.label}`;
            
            const list = document.getElementById('exercise-list');
            list.innerHTML = '';
            
            const exercises = generateDailyRoutine(state.gender, state.activeDay);
            
            exercises.forEach((ex) => {
                const div = document.createElement('div');
                div.className = "glass p-3 rounded-2xl flex items-center gap-4 border-l-4 border-rose-600 hover:bg-slate-800/50 transition";
                div.innerHTML = `
                    <div class="relative w-16 h-16 flex-shrink-0">
                        <img src="https://img.youtube.com/vi/${ex.ytId}/hqdefault.jpg" class="exercise-thumb" alt="${ex.name}">
                        <div class="absolute inset-0 bg-black/40 rounded-xl flex items-center justify-center"><span class="text-white text-[10px]">▶</span></div>
                    </div>
                    <div class="flex-1">
                        <h4 class="font-bold text-xs uppercase italic text-white">${ex.name}</h4>
                        <p class="text-[10px] text-slate-400 font-medium uppercase">${ex.reps} • <span class="text-rose-400">${ex.time}s</span></p>
                    </div>
                    <button onclick="startExerciseTimer('${ex.name}', ${ex.time}, '${ex.reps}', '${ex.ytId}')" class="w-10 h-10 flex items-center justify-center bg-rose-600 text-white rounded-xl shadow-lg">
                        <span class="text-[10px] font-black italic">GO</span>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        function getRoutineTypeForDay(day) {
            // Lógica: 1-2 Fuerza, 3 Core, 4-5 HIIT, 6 Titan Mix, 7 Descanso Activo
            const dayInWeek = ((day - 1) % 7) + 1;
            if (dayInWeek <= 2) return { key: 'strength', label: 'FUERZA Y PODER' };
            if (dayInWeek === 3) return { key: 'core', label: 'ESTABILIDAD CORE' };
            if (dayInWeek <= 5) return { key: 'hiit', label: 'QUEMA CALÓRICA (HIIT)' };
            return { key: 'mix', label: 'TITAN MIX (FULL BODY)' };
        }

        function generateDailyRoutine(gender, day) {
            const pool = EXERCISE_POOL[gender];
            const type = getRoutineTypeForDay(day).key;
            
            if (type === 'mix') {
                return [pool.strength[0], pool.hiit[0], pool.core[0], pool.strength[1], pool.hiit[1]];
            }
            
            const base = [...pool[type]];
            // Barajamos un poco según el día para que no sea idéntico
            return base.sort(() => 0.5 - (day % 10 / 10)).slice(0, 5);
        }

        // --- TEMPORIZADOR ---
        let timerInterval = null;
        let timeLeft = 0;
        let totalTimeSet = 0;

        function startExerciseTimer(name, seconds, reps, ytId) {
            timeLeft = seconds;
            totalTimeSet = seconds;
            document.getElementById('timer-exercise-name').innerText = name;
            document.getElementById('timer-reps').innerText = `OBJETIVO: ${reps}`;
            document.getElementById('timer-display').innerText = formatTime(seconds);
            document.getElementById('timer-video-iframe').src = `https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&loop=1&playlist=${ytId}&controls=1`;
            document.getElementById('modal-timer').classList.remove('hidden');
            resetTimerUI();
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('btn-timer-toggle');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = "CONTINUAR";
            } else {
                btn.innerText = "PAUSAR";
                timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer-display').innerText = formatTime(timeLeft);
                    updateTimerCircle();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        document.getElementById('timer-display').innerText = "DONE!";
                    }
                }, 1000);
            }
        }

        function updateTimerCircle() {
            const circle = document.getElementById('timer-circle');
            const offset = 596.9 - (timeLeft / totalTimeSet * 596.9);
            circle.style.strokeDashoffset = offset;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            timeLeft = totalTimeSet;
            document.getElementById('timer-display').innerText = formatTime(timeLeft);
            resetTimerUI();
        }

        function resetTimerUI() {
            document.getElementById('btn-timer-toggle').innerText = "INICIAR";
            document.getElementById('timer-circle').style.strokeDashoffset = 0;
        }

        function closeTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timer-video-iframe').src = "";
            document.getElementById('modal-timer').classList.add('hidden');
        }

        function completeDay() {
            if (!state.completedDays.includes(state.activeDay)) {
                state.completedDays.push(state.activeDay);
                state.totalTimeSpent += 25; 
                localStorage.setItem('titan_completed', JSON.stringify(state.completedDays));
                localStorage.setItem('titan_time', state.totalTimeSpent);
            }
            showDashboard();
        }

        function resetApp() {
            if(confirm("¿Estás seguro de reiniciar todo el reto de 28 días?")) {
                localStorage.clear();
                location.reload();
            }
        }

        window.onload = init;
    </script>
</body>
</html>
